[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "btc-polymarket-edge"
version = "0.1.0"
description = "BTC Polymarket edge-finding tool"
requires-python = ">=3.11"

dependencies = [
    "websockets>=12.0",
    "aiohttp>=3.9",
    "pandas>=2.0",
    "numpy>=1.24",
    "python-telegram-bot>=21.0",
    "pydantic-settings>=2.0",
    "aiosqlite>=0.20",
    "py-clob-client>=0.1.0",
]

[tool.setuptools.packages.find]
include = ["data*", "signals*", "strategy*", "alerts*", "storage*"]

[project.scripts]
btc-edge = "main:main"
